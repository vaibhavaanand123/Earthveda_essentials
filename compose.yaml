services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: https://earthvedaessentials.de
      TRUST_PROXY: 1
      DATABASE_PATH: /app/data/earthveda.sqlite
    volumes:
      - store_data:/app/data
    expose:
      - '8787'
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  store_data:
  caddy_data:
  caddy_config:
